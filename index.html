<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Future Pulse - Global AI & Future Tech Media</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d1117; color: #c9d1d9; line-height: 1.6; }
        header { background: #161b22; padding: 20px; text-align: center; border-bottom: 1px solid #30363d; }
        h1 { color: #58a6ff; font-size: 2.5rem; margin-bottom: 5px; }
        p.tagline { color: #8b949e; font-size: 1.1rem; }
        .container { max-width: 800px; margin: 40px auto; padding: 20px; text-align: center; }
        .search-box { display: flex; gap: 10px; justify-content: center; margin-top: 30px; }
        input[type="text"] { width: 70%; padding: 15px; font-size: 1rem; background: #21262d; border: 1px solid #30363d; color: #fff; border-radius: 8px; outline: none; }
        input[type="text"]:focus { border-color: #58a6ff; }
        button { padding: 15px 25px; font-size: 1rem; background: #238636; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        button:hover { background: #2ea043; }
        .content-area { margin-top: 40px; text-align: left; background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; }
        .content-area h2 { color: #58a6ff; margin-bottom: 15px; }
        .article-body { margin-top: 15px; white-space: pre-line; color: #e6edf3; }
    </style>
</head>
<body>

    <header>
        <h1>AI Future Pulse</h1>
        <p class="tagline">Your Gateway to the Autonomous AI & Future Tech Era</p>
    </header>

    <div class="container">
        <h2>What do you want to explore today?</h2>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search any AI tool, prompt, or future tech topic...">
            <button onclick="handleSearch()">Search & Generate</button>
        </div>

        <div class="content-area" id="resultArea">
            <h2>Welcome to AI Future Pulse</h2>
            <p>Type any query above. Our autonomous engine will instantly generate a full-scale blog post for you using Gemini AI!</p>
        </div>
    </div>

    <script>
        const GEMINI_API_KEY = "AQ.Ab8RN6JJFWTyIt-LMVK5cmb7t-rnmjQX0g2XVmeF8I0KQUg5uw";

        async function handleSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const resultArea = document.getElementById('resultArea');
            
            if(query === "") {
                alert("Pehle kuch type toh karo bhai!");
                return;
            }

            resultArea.innerHTML = `<h2>Autonomous Engine Working...</h2><p>Generating high-value article and embedding insights for: <b>"${query}"</b>. Please wait a few seconds...</p>`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: `Write a comprehensive, professional, SEO-optimized tech blog post about "${query}" for a website named AI Future Pulse. Include an engaging title, detailed body paragraphs, practical use cases, and a suggested video or resource section.` }]
                        }]
                    })
                });

                const data = await response.json();
                const aiText = data.candidates[0].content.parts[0].text;

                resultArea.innerHTML = `
                    <h2>Generated Article: ${query}</h2>
                    <div class="article-body">${aiText}</div>
                `;
            } catch (error) {
                resultArea.innerHTML = `<h2>Error</h2><p>Failed to generate content. Please check your API key or connection.</p>`;
                console.error(error);
            }
        }
    </script>

</body>
</html>
